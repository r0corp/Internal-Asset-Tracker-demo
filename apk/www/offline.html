<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AIT HRGA</title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        background: #0b1220;
        color: #cbd5e1;
        font-family: -apple-system, Segoe UI, Roboto, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      #status-screen {
        text-align: center;
      }
      #brand-logo {
        width: 96px;
        height: 96px;
        object-fit: contain;
        animation: brandPulse 1.8s ease-in-out infinite;
      }
      @keyframes brandPulse {
        0%, 100% {
          transform: scale(1);
          filter:
            drop-shadow(0 0 10px rgba(234, 179, 8, 0.55))
            drop-shadow(0 0 22px rgba(220, 38, 38, 0.35));
        }
        50% {
          transform: scale(1.08);
          filter:
            drop-shadow(0 0 18px rgba(234, 179, 8, 0.8))
            drop-shadow(0 0 34px rgba(220, 38, 38, 0.6));
        }
      }
      #status-text {
        margin: 20px 0 14px;
        font-size: 14px;
        color: #94a3b8;
      }
      .wave {
        display: flex;
        justify-content: center;
        gap: 6px;
      }
      .wave span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #2563eb;
        animation: waveBounce 1.1s ease-in-out infinite;
      }
      .wave span:nth-child(2) { animation-delay: 0.12s; }
      .wave span:nth-child(3) { animation-delay: 0.24s; }
      .wave span:nth-child(4) { animation-delay: 0.36s; }
      .wave span:nth-child(5) { animation-delay: 0.48s; }
      @keyframes waveBounce {
        0%, 60%, 100% { transform: translateY(0); opacity: 0.5; }
        30% { transform: translateY(-10px); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="status-screen">
      <img id="brand-logo" src="brand-logo.png" alt="" />
      <div id="status-text">Koneksi terputus, menyambungkan ulang...</div>
      <div class="wave"><span></span><span></span><span></span><span></span><span></span></div>
    </div>

    <script>
      // Halaman ini dimuat otomatis oleh native Android (lihat
      // MainActivity.java - WebViewClient kustom) setiap kali navigasi
      // utama gagal (server mati, WiFi putus, dll), menggantikan
      // halaman error bawaan browser ("ERR_CONNECTION_REFUSED" dkk)
      // dengan tampilan bermerek yang senada dengan loader awal.
      // Otomatis coba lagi dari index.html (yang akan mendeteksi ulang
      // LAN kantor vs internet publik) tanpa perlu user ketuk apapun.
      setTimeout(function () {
        window.location.replace("index.html");
      }, 1800);
    </script>
  </body>
</html>
